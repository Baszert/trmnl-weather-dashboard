---
strategy: polling
no_screen_padding: 'no'
dark_mode: 'no'
static_data: ''
polling_verb: get
framework_version: 3.3.2
serverless_language: ''
polling_url: https://api.open-meteo.com/v1/forecast?latitude={{ trmnl.plugin_settings.custom_fields_values.latitude }}&longitude={{ trmnl.plugin_settings.custom_fields_values.longitude }}&current=temperature_2m,weather_code&daily=temperature_2m_max,temperature_2m_min,weather_code,precipitation_sum&temperature_unit={{ trmnl.plugin_settings.custom_fields_values.temperature_unit }}&timezone=auto&forecast_days=8
polling_headers: ''
polling_body: ''
id: 191027
oauth_enabled: 'false'
oauth_pkce_enabled: 'no'
oauth_authorize_url: ''
oauth_token_url: ''
oauth_scopes: ''
oauth_scope_separator: ''
oauth_refresh_url: ''
oauth_auth_params: ''
oauth_token_headers: ''
oauth_token_site: ''
oauth_token_params: ''
oauth_token_request_auth_method: ''
oauth_body_format: ''
oauth_token_response_metadata: ''
oauth_authorization_method: ''
oauth_refresh_params: ''
oauth_token_field_name: ''
oauth_expiry_field_name: ''
oauth_expiry_strategy: ''
oauth_fixed_expiry_ms: ''
custom_fields:
- name: About this plugin
  keyname: author_bio
  field_type: author_bio
  description: Yet another weather dashboard! Get a weather dashboard with a 3-day forecast, visualized by dot-matrix style numbers and some useful icons. Powered by Open-Meteo API.
  email_address: trmnl@achtnegen.nl
  github_url: https://github.com/Baszert/trmnl-weather-dashboard/
- keyname: location
  name: Location
  field_type: string
  default: ''
- keyname: latitude
  name: Latitude
  field_type: string
  default: ''
  help_text: Use <a href="https://www.gps-coordinates.net/" target="_blank">GPS Coordinates website</a> to find your Latitude
- keyname: longitude
  name: Longitude
  field_type: string
  default: ''
  help_text: Use <a href="https://www.gps-coordinates.net/" target="_blank">GPS Coordinates website</a> to find your Longitude
- keyname: temperature_unit
  name: Temperature Unit
  field_type: select
  default: celsius
  options:
  - Celsius (°C): celsius
  - Fahrenheit (°F): fahrenheit
- keyname: color_mode
  name: Color Mode
  field_type: select
  default: dark
  options:
  - Dark: dark
  - Light: light
name: Weather Dashboard
description: Weather with some dot matrix style
refresh_interval: 60
